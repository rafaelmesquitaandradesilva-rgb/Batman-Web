<!DOCTYPE html>
<html>
<head>
	<link rel="icon" type="image/x-icon" href="batman3.png">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bat Helicpeter</title>

	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: black;
			background-image: url(batman1.jpg);
			background-repeat: no-repeat;
			background-position: center center;
			background-attachment: fixed;
			background-size: cover;
			max-width: 100%;
			overflow-x: hidden;
		}


		h3 {
			display: block;
			text-align: center;
			max-width: 900px;
			font-size: 21px;
			font-family: Oswald, sans-serif;
			margin: 0 auto;
		}

		#menu {
			width: fit-content;
			max-width: 990px;
			color: white;
			font-family: Rockwell, serif;
			font-size: 12px;
			text-align: center;
			background-color: black;
			box-shadow: 5px 10px 30px;
			display: block;
			margin: 0 auto;
			padding: 6px 12px;
		}

		#menu a {
			color: #f39c12;
			text-decoration: none;
		}

		#menu a:hover {
			color: #f1c40f;
		}

		.arena {
			position: relative;
			width: 100%;
			height: 600px;
			pointer-events: none;
		}

		#heli {
			position: absolute;
			top: 50px;
			left: 100px;
			width: 450px; 
			height: auto;
			animation: helicoptero 9s infinite alternate ease-in-out;
			will-change: transform;
		}

		@keyframes helicoptero {
			0% {
				transform: translate3d(0px, 0px, 0) scale(0.5) rotate(-3deg) scaleX(1);
			}
			50% {
				transform: translate3d(500px, 120px, 0) scale(0.85) rotate(4deg) scaleX(1);
			}
			100% {
				transform: translate3d(950px, 20px, 0) scale(0.5) rotate(-2deg) scaleX(-1);
			}
		}

		#bat {
			position: absolute;
			top: 20px;
			left: 50px;
			width: 300px;
			height: auto;
			animation: morcego 6s infinite alternate ease-in-out;
			will-change: transform;
		}

		@keyframes morcego {
			0% {
				transform: translate3d(100px, 150px, 0) scale(0.4) rotate(-8deg) scaleX(1);
			}
			50% {
				transform: translate3d(600px, 50px, 0) scale(0.7) rotate(6deg) scaleX(1);
			}
			100% {
				transform: translate3d(1100px, 120px, 0) scale(0.5) rotate(-5deg) scaleX(-1);
			}
		}
	</style>
</head>
<body id="Início">

	<div id="menu">
		<a href="index.html">
			<h3 align="center">Voltar</h3>
		</a>
	</div>

	<br>

	<div class="arena">
		<img src="helicopeterobat.png" id="heli" alt="Batcóptero">
		<img src="humanbat.png" id="bat" alt="Morcego Humano">
	</div>

</body>
</html>
